name: Nightly market update

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      note:
        description: "Structural note for today's history.csv row (no commas or quotes). Leave empty on normal runs."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Kalshi and Polymarket prices
        run: python3 scripts/fetch_markets.py

      - name: Install pdftotext for the name ID crosstabs
        run: sudo apt-get install -y -qq poppler-utils

      - name: Pull Economist/YouGov name ID and favorability
        run: python3 scripts/fetch_nameid.py

      - name: Install pandas for the poll scrape
        run: pip install --quiet pandas lxml

      - name: Pull national primary polls from Wikipedia
        run: python3 scripts/fetch_polls.py

      - name: Pull the Trump approval average
        run: python3 scripts/fetch_approval.py

      - name: Count news attention per candidate (display only)
        run: python3 scripts/fetch_attention.py

      - name: Fit market strengths for the anchor slider
        run: node scripts/calibrate_anchor.js

      - name: Run the 50,000 simulation baseline
        env:
          NOTE: ${{ github.event.inputs.note }}
        run: node scripts/baseline.js

      - name: Grade open calls against today's data
        run: node scripts/calls.js grade

      - name: Check that no past call was edited
        run: node scripts/calls.js lock HEAD

      - name: Check that the knobs match knobs.json
        run: node scripts/knobs.js check

      - name: Build the turning point heatmap at default settings
        run: node scripts/heatmap.js

      - name: Write the desk note
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
        run: python3 scripts/desk_note.py

      - name: Install Playwright Chromium for the share cards
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.47.2
          npx playwright install --with-deps chromium

      - name: Render share cards
        run: node scripts/render_cards.js

      - name: Commit and push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add markets.json nameid.csv polls.csv attention.csv approval.json anchor.json history.csv default.json wire.json heatmap.json rankings.json calls.csv notes cards share
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "nightly update $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
