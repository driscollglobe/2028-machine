name: Nightly market update

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      note:
        description: "Structural note for today's history.csv row (no commas or quotes). Leave empty on normal runs."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Kalshi and Polymarket prices
        run: python3 scripts/fetch_markets.py

      - name: Install pandas for the poll scrape
        run: pip install --quiet pandas lxml

      - name: Pull national primary polls from Wikipedia
        run: python3 scripts/fetch_polls.py

      - name: Fit market strengths for the anchor slider
        run: node scripts/calibrate_anchor.js

      - name: Run the 20,000 simulation baseline
        env:
          NOTE: ${{ github.event.inputs.note }}
        run: node scripts/baseline.js

      - name: Build the turning point heatmap at default settings
        run: node scripts/heatmap.js

      - name: Install Playwright Chromium for the share cards
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.47.2
          npx playwright install --with-deps chromium

      - name: Render share cards
        run: node scripts/render_cards.js

      - name: Commit and push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add markets.json polls.csv anchor.json history.csv default.json wire.json heatmap.json rankings.json cards share
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "nightly update $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
