name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unit tests
        run: node --test tests/*.test.js

      - name: Calls lock against the base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF="origin/${{ github.base_ref }}"
          else
            REF="${{ github.event.before }}"
            if ! git cat-file -e "$REF" 2>/dev/null; then REF="HEAD~1"; fi
          fi
          node scripts/calls.js lock "$REF"
